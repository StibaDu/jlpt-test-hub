    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the JLPT?",
          "acceptedAnswer": { "@type": "Answer", "text": "The Japanese-Language Proficiency Test (JLPT) is the official certification of Japanese language ability, run by the Japan Foundation and JEES. It has five levels: N5 (beginner) to N1 (advanced). The test is held twice a year, in July and December." }
        },
        {
          "@type": "Question",
          "name": "How many questions are on the JLPT N5?",
          "acceptedAnswer": { "@type": "Answer", "text": "The JLPT N5 has three sections: Vocabulary (25 min), Grammar & Reading (50 min), and Listening (30 min). The total test time is approximately 90 minutes with around 60-70 questions across all sections." }
        },
        {
          "@type": "Question",
          "name": "What score do I need to pass the JLPT?",
          "acceptedAnswer": { "@type": "Answer", "text": "To pass any JLPT level, you need at least 80 out of 180 total points. You also need a minimum section score: 38/120 on language knowledge and reading, and 19/60 on listening. Our simulator uses a 60% pass threshold for practice." }
        },
        {
          "@type": "Question",
          "name": "Is this JLPT practice test free?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. JLPT Test Hub is 100% free with no signup, no paywalls, and no subscriptions. All practice questions, the furigana dictionary, and both test modes (real exam simulation and learning mode) are completely free." }
        },
        {
          "@type": "Question",
          "name": "Are these real JLPT questions?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Our questions are sourced from the official JLPT Practice Workbook (2018 edition), published by the Japan Foundation. These are real questions selected from actual tests administered since the 2010 revision." }
        },
        {
          "@type": "Question",
          "name": "What is furigana and why is it useful?",
          "acceptedAnswer": { "@type": "Answer", "text": "Furigana are small phonetic guides (hiragana) printed above kanji to show their pronunciation. Our simulator includes interactive furigana — click any kanji in a question to see its reading, meaning, and usage context. This helps learners understand vocabulary in context while practicing." }
        },
        {
          "@type": "Question",
          "name": "Can I practice JLPT N4 and N3 on this site?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. JLPT Test Hub supports N5, N4, and N3 with 50 official questions per level. Use the level switcher in the navigation bar to switch between levels at any time." }
        },
        {
          "@type": "Question",
          "name": "How should I prepare for the JLPT?",
          "acceptedAnswer": { "@type": "Answer", "text": "Start with Learning Mode (untimed, instant explanations) to understand the grammar and vocabulary. Then switch to Real Test Mode (timed, no feedback) to simulate exam conditions. Aim for 60%+ consistently before the real exam. Study kanji and vocabulary daily, and practice with official questions." }
        }
      ]
    }
    </script>
